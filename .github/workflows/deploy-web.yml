name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/presence-protocol/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml
  schedule:
    # A daily rebuild keeps the stars and activity on project cards current.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rustbuilderz.xyz
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rustbuilderz/web check
      - run: pnpm --filter @rustbuilderz/web build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @rustbuilderz/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
